name: Update playlist and logos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download public logo catalogue
        uses: actions/checkout@v5
        with:
          repository: tv-logo/tv-logos
          path: .logo-source
          fetch-depth: 1
          sparse-checkout: countries

      - name: Build playlist and cache logos
        env:
          PUBLIC_BASE_URL: https://carlosciller.github.io/uhf-playlist
          TV_LOGOS_DIR: .logo-source/countries
        run: python scripts/build_playlist.py

      - name: Validate generated playlist
        run: python scripts/validate_playlist.py

      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update playlist and logos"
            git push
          fi
